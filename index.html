<!DOCTYPE html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles/styles.css">

    <title>Superhero Page</title>
  </head>

  <body class="bg-[url('./img/fondo.jpg')] bg-cover bg-fixed bg-center min-h-screen">
    <header
      class="bg-sky-950 dark:bg-slate-900 text-white shadow-md transition-colors duration-300"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
          <div class="flex-shrink-0">
            <img
              src="./img/logo.jpg"
              alt="Logo Superhero"
              class="h-12 w-auto"
            />
          </div>

          <div class="flex items-center">
            <button
              id="theme-toggle"
              class="relative inline-flex h-8 w-14 items-center rounded-full bg-black border-2 border-red-600 transition-colors duration-300 focus:outline-none"
            >
              <span class="sr-only">Cambiar modo</span>
              <span
                id="switch-circle"
                class="inline-block h-5 w-5 transform rounded-full bg-red-600 transition-transform duration-300 translate-x-1"
              ></span>
              <span id="theme-icon" class="ml-2 text-xs">🌙</span>
            </button>
          </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <section class="mb-12">
            <div class="bg-white/90 dark:bg-slate-800/90 p-8 rounded-2xl shadow-xl border-b-8 border-red-600 transition-colors duration-300 backdrop-blur-sm">
                <h2 class="text-3xl font-black text-sky-950 dark:text-red-500 mb-6 uppercase italic">
                    Encuentra a tu Héroe
                </h2>

                <div class="flex flex-wrap gap-5 justify-center items-center">
                    <input 
                        id="hero-search" 
                        type="text" 
                        placeholder="Buscar por nombre..." 
                        class="flex-1 min-w-[200px] p-4 rounded-lg border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:border-red-600 outline-none transition-all shadow-inner"
                    />

                    <select id="race-filter" class="min-w-[140px] bg-slate-100 dark:bg-slate-700 p-4 text-black dark:text-white focus:outline-none rounded-lg font-bold border-2 border-transparent focus:border-red-600 cursor-pointer">
                        <option value="">Raza</option>
                        <option value="Human">Humano</option>
                        <option value="Mutant">Mutante</option>
                        <option value="Cyborg">Cyborg</option>
                        <option value="Asgardian">Asgardiano</option>
                        <option value="Alien">Alienígena</option>
                        <option value="Kryptonian">Criptoniano</option>
                        <option value="God / Eternal">Dios</option>
                    </select>

                    <select id="gender-filter" class="min-w-[140px] bg-slate-100 dark:bg-slate-700 p-4 text-black dark:text-white focus:outline-none rounded-lg font-bold border-2 border-transparent focus:border-red-600 cursor-pointer">
                        <option value="">Género</option>
                        <option value="Male">Masculino</option>
                        <option value="Female">Femenino</option>
                        <option value="-">N/A</option>
                    </select>

                    <select id="sort-order" class="min-w-[140px] bg-slate-100 dark:bg-slate-700 p-4 text-black dark:text-white focus:outline-none rounded-lg font-bold border-2 border-transparent focus:border-red-600 cursor-pointer">
                        <option value="asc">A - Z</option>
                        <option value="desc">Z - A</option>
                    </select>

                    <button id="search-button" class="bg-red-600 hover:bg-black text-white font-black py-4 px-10 rounded-full transition-all duration-300 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,0.2)] active:translate-y-1 active:shadow-none uppercase tracking-widest">
                        BUSCAR
                    </button>
                </div>
            </div>
        </section>

        <section id="results-section">
            <h3 class="text-2xl font-bold text-red-600 mb-8 uppercase tracking-widest border-l-8 border-red-600 pl-4">
                Héroes Encontrados
            </h3>
            <div id="heroes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
        </section>

        <section id="details" class="hidden"></section>

    <section id="pagination" class="flex gap-5 justify-center items-center mb-12 py-6">
    <button
        id="prev-btn"
        disabled
        class="bg-red-600 hover:bg-red-800  text-white font-black py-3 px-8 rounded-lg transition-all duration-300 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,0.2)] active:translate-y-1 active:shadow-none disabled:opacity-30 disabled:cursor-not-allowed uppercase tracking-widest text-sm">
         Anterior
    </button>

    <div class="relative group">
        <div class="absolute -inset-1 bg-red-600 rounded-lg blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
        <span id="page-num" class="relative py-2.5 px-6 bg-white dark:bg-slate-900 border-2 border-red-600 rounded-lg text-xl font-black text-sky-950 dark:text-white italic inline-block">
            1
        </span>
    </div>

    <button
        id="next-btn"
        class="bg-red-600 cursor-pointer hover:bg-red-800 text-white font-black py-3 px-8 rounded-lg transition-all duration-300 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,0.2)] active:translate-y-1 active:shadow-none disabled:opacity-30 disabled:cursor-not-allowed uppercase tracking-widest text-sm"
    >
        Siguiente
    </button>
   </section>

    </main>
    <script src="js/main.js"></script>

  </body>
</html>
