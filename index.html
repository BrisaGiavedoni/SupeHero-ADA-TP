<!DOCTYPE html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Superhero Page</title>
  </head>

  <body class="bg-[url('./img/fondo.jpg')] bg-cover bg-fixed bg-center min-h-screen">
    <header
      class="bg-sky-950 dark:bg-slate-900 text-white shadow-md transition-colors duration-300"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
          <div class="flex-shrink-0">
            <img
              src="./img/logo.jpg"
              alt="Logo Superhero"
              class="h-12 w-auto"
            />
          </div>

          <div class="flex items-center">
            <button
              id="theme-toggle"
              class="relative inline-flex h-8 w-14 items-center rounded-full bg-black border-2 border-red-600 transition-colors duration-300 focus:outline-none"
            >
              <span class="sr-only">Cambiar modo</span>
              <span
                id="switch-circle"
                class="inline-block h-5 w-5 transform rounded-full bg-red-600 transition-transform duration-300 translate-x-1"
              ></span>
              <span id="theme-icon" class="ml-2 text-xs">🌙</span>
            </button>
          </div>
    </header>

<main class="max-w-7xl mx-auto px-4 py-12">
   <section class="max-w-7xl mx-auto px-4 py-12">
    <div class="bg-white/90 dark:bg-slate-800/90 p-8 rounded-2xl shadow-xl border-b-8 border-red-600 transition-colors duration-300 backdrop-blur-sm">
        
        <h2 class="text-3xl font-black text-sky-950 dark:text-red-500 mb-6 uppercase italic">
            Encuentra a tu Héroe
        </h2>
        
        <form id="search-form" class="flex flex-col md:flex-row gap-4">
            <label for="hero-search" class="sr-only">Nombre del superhéroe</label>
            <input 
                id="hero-search"
                type="text" 
                placeholder="Ej: Iron Man, Spider-Man..." 
                class="flex-1 p-4 rounded-lg border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-white focus:border-red-600 outline-none transition-all"
            />
            
            <button type="submit" class="bg-red-600 hover:bg-black text-white font-black py-4 px-10 rounded-lg transition-all duration-300 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,0.2)] active:translate-y-1 active:shadow-none">
                BUSCAR
            </button>
        </form>
    </div>
</section>

<section id="results-section" class="max-w-7xl mx-auto px-4 py-12">
    <h3 class="text-2xl font-bold text-red-600 mb-8 uppercase tracking-widest border-l-8 border-red-600 pl-4">
        Héroes Encontrados
    </h3>
</section>
</main>

  </body>
</html>
